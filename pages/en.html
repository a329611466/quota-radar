<!doctype html>
<html lang="en" data-locale="en" data-theme="felt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watermark — Codex quota reset tracker</title>
    <meta name="description" content="Watermark — Codex quota reset tracker — 独立追踪 @thsottiaux 公布的 Codex 使用额度重置。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Chakra+Petch:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cr.theme');
          if (t !== 'felt' && t !== 'ink' && t !== 'memphis' && t !== 'neon') t = 'felt';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'felt';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
