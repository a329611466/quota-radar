# Cloudflare Workers 静态资源部署配置
# 文档：https://developers.cloudflare.com/workers/static-assets/
#
# 用法：
#   npm run build && npx wrangler deploy
#
# 只想快速上线、不打算加 API 的话，更简单的是走 Pages：
#   npm run build && npx wrangler pages deploy dist --project-name=quota-radar

name = "quota-radar"
compatibility_date = "2025-09-01"
# Cloudflare 账号 ID（Workers & Pages → Overview → Account ID）
account_id = "94c6721f6e9f94af1d9389a2199d98d0"
main = "worker/index.ts"

# 静态资源 + Worker 函数共存：静态资源交给 ASSETS 绑定，
# /api/resets、/api/status、.ics、feed.xml 由 Worker 动态生成
[assets]
directory = "./dist"
binding = "ASSETS"
# /en 自动补成 /en/，保证相对路径（../assets/）解析正确
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# 默认静态资源优先：命中 .ics / feed.xml 就直接返回构建期旧文件，
# Worker 里的动态生成逻辑不会执行。开启这个让 Worker 优先，
# .ics / feed.xml 才会用 KV 里的最新数据动态生成。
run_worker_first = true

# 数据快照存 KV，Worker 定时从上游拉取后写入
[[kv_namespaces]]
binding = "RESETS"
id = "052324df47804c91bdbd5d23cf8e0e55"

# 每 15 分钟自动更新一次数据（免费版最多 3 个 cron，最小间隔 1 分钟）
[triggers]
crons = ["*/15 * * * *"]
